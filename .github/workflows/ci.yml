name: Cross-platform checks

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Linux native runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libgles2 libegl1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-activity.txt
          python -m pip install ruff==0.16.7 pyright==1.1.414 build
      - name: Check dependency consistency
        run: python -m pip check
      - name: Compile source
        run: python -m compileall -q src scripts tests
      - name: Lint Python
        run: python -m ruff check --config pyproject.toml src scripts tests
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check formatting
        run: python -m ruff format --check --config pyproject.toml src scripts tests
      - name: Check types
        run: python -m pyright src scripts
      - name: Build distributions
        run: python -m build
      - name: Verify wheel installation outside checkout
        run: python scripts/verify_wheel.py
