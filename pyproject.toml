[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "integrated-monitoring-poc"
version = "0.2.1"
description = "Cross-platform multi-person computer-vision monitoring proof of concept"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "opencv-contrib-python>=4.13,<4.14",
    "opencv-python>=4.13,<4.14",
    "numpy>=2.2,<2.5",
    "mediapipe>=0.10.35,<0.11",
    "emotiefflib>=1.1.1,<1.2",
    "ultralytics>=8.4,<8.5",
    "lap>=0.5.13,<0.6",
    "torch>=2.13,<2.14",
]

[project.scripts]
integrated-monitoring = "main:main"

[tool.setuptools.package-data]
monitoring_assets = ["*.tflite", "*.yaml"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "camera",
    "config",
    "detection",
    "dependency_privacy",
    "data_policy",
    "diagnostics",
    "emotion",
    "enrollment",
    "events",
    "gesture",
    "identity",
    "logging_setup",
    "main",
    "media_export",
    "model_manager",
    "overlays",
    "pose",
    "review",
    "validation",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["activity_recognition*", "monitoring_assets*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Entrypoints/tests add src to sys.path; emotion configures library caches first.
"scripts/*.py" = ["E402"]
"tests/*.py" = ["E402"]
"src/emotion.py" = ["E402"]
